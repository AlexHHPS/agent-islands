name: Documentation improvement
description: Report incorrect instructions, missing examples or unclear documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link to the affected documentation.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Include the command, example or explanation that would help.

name: Bug report
description: Report reproducible behavior with sanitized data.
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private prompts, usernames and authentication state. Security issues follow SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, CPU architecture, app version and harness versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a minimal fixture project where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Review screenshots and logs before attaching them.
